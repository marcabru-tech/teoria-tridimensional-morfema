name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest>=7.0.0 pytest-cov>=3.0.0 flake8>=4.0.0 black>=22.0.0 mypy>=0.950

      - name: Check formatting with black
        run: |
          black --check --line-length=100 ttm/

      - name: Lint with flake8
        run: |
          flake8 ttm/ --max-line-length=100 --extend-ignore=E203 --count --show-source --statistics

      - name: Type-check with mypy
        run: |
          mypy ttm/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=ttm --cov-report=term-missing --cov-report=xml

      - name: Check import
        run: |
          python -c "from ttm import Morpheme, Language; print('Import OK')"

      - name: Run example
        run: |
          python examples/arabic_ktb.py

  web:
    # Compila e testa o site como no deploy: aplica o .vercelignore da raiz
    # antes do build, para provar que nada de web/ some e que a base de
    # raízes vai dentro do bundle.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check roots database sync (data/roots vs web/src/data/roots)
        run: npm run check:data

      - name: Reference set and engine tests (normalização, construtor hebraico, motor S2.2)
        run: |
          node --test tests/reference/normalize.test.mjs
          node --test tests/ttm/engine.test.mjs
          (cd tests/reference/tools && python3 -m unittest -v test_he_build)

      - name: Apply .vercelignore to simulate the Vercel upload
        # Remove exatamente o que a Vercel removeria (inclui data/), para
        # provar que o build e a base de raízes não dependem desses arquivos.
        working-directory: .
        run: |
          git ls-files | git -c core.excludesFile=.vercelignore check-ignore --no-index --stdin > /tmp/vercelignored.txt || true
          echo "Removendo $(wc -l < /tmp/vercelignored.txt) arquivos"
          if grep '^web/' /tmp/vercelignored.txt; then echo "::error::.vercelignore remove arquivos de web/"; exit 1; fi
          xargs -a /tmp/vercelignored.txt rm -f

      - name: Build
        run: npm run build

      - name: Smoke tests against local server
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/ > /dev/null || {
            echo "Server did not start within 30 seconds"
            exit 1
          }
          npm run smoke -- http://localhost:3000
          # Conjunto de referência: só registra o relatório. O --enforce entra quando as duas línguas passarem de 90% (hebraico em 86,7% no S2.2)
          node tests/reference/evaluate.mjs http://localhost:3000 --report /tmp/relatorio-referencia.md
